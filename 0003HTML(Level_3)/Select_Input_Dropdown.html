<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Element</title>
</head>
<body>
    <form action="/server">
        Choose Any Fruit You Like : 
        <select name="fruits" id="fruit">
            <option>---Select an Option---</option>
            <option value="app" >Apple</option>
            <option value="ban">Banana</option>
            <option value="man" selected>Mango</option>
        </select>
    
        <button>Submit</button>
    </form>
</body>
</html>
