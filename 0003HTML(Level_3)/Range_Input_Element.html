<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Input Element</title>
</head>
<body>
    <form action="/server">
        <!-- by default also range is from 0 to 100 -->
        <div>
            <label for="Volume">Volume : </label>
            <input type="range" min="0" max="100" name="vol" id="Volume" step="10" value="70">
        </div>
        
        <div>
            <button>Submit</button>
        </div>
    </form>
</body>
</html>
