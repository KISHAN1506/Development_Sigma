<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Box</title>
</head>
<body>
    <form action="/server">
        <input type="checkbox" id="age" name="age">
        <label for="age">I am 18+</label>
        <button>submit</button>
        <!-- if the button is checked then in URL 'ON' is passes
            If not checked then nothing is passed in the URL
        -->
    </form>
</body>
</html>
