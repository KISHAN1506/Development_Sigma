<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3</title>
</head>
<body>
    <form action="/server">
        <h2>Feedback Form</h2>
        <div>
                <label for="name">Name:</label>
                <input type="text" placeholder="Enter Name" id="name" name="name">
            </div>
            <br>
            <div>
                <label for="email">Email:</label>
                <input type="text" placeholder="Enter Email" id="email" name="email">
            </div>
            <br>
            <div>
                <label for="message">Message :</label>
                <br>
                <textarea name="message" id="message"></textarea>
            </div>
            <br>
            <div>
                <label for="rating">Rate us out of 5 :</label>
                <br>
                <input type="radio" id="1s" name="rating" value="1star">
                <label for="1s">1</label>
                <br>
                <input type="radio" id="2s" name="rating" value="2star">
                <label for="2s">2</label>
                <br>
                <input type="radio" id="3s" name="rating" value="3star">
                <label for="3s">3</label>
                <br>
                <input type="radio" id="4s" name="rating" value="4star">
                <label for="4s">4</label>
                <br>
                <input type="radio" id="5s" name="rating" value="5star">
                <label for="5s">5</label>
                <br>
            </div>
            <div>
                <button>Send your message!</button>
            </div>
        
    </form>
</body>
</html>
