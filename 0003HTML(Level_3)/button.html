<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
</head>
<body>
    <!-- action attribute will tell where will all the information go -->
    <form action="/server">
        <div>
            <label for="Username">Username :</label>
            <input type="text" name="" id="Username" placeholder="Enter Username ">
        </div>

        <div>
            <label for="password">Enter password :</label>
            <input type="text" name="" id="password" placeholder="Enter Password">
        </div>
        <button>Submit</button>
        <button type="submit">Type1</button>
        <button type="reset">Type2</button>
        <button type="button">Type3</button>


        <!-- BY default value empty -->
        <input type="button" value="click me">
        <input type="submit" value="click me to do something">

        <!-- BY default value submit -->
        <input type="submit">
        
    </form>

</body>
</html>
