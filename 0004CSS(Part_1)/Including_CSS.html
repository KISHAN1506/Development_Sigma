<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Including CSS</title>
    <!-- Adding Style Tag in head -->
    <style>
        h1{
            background-color: bisque;
        }
    </style>

    <!-- Method 3 is linking new CSS file to html file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Inline CSS -->
    <h1 style="color: red;">Kishan Agarwal</h1>
    <p style="color: lightblue;">A general Paragraph</p>
    <button style="color: pink; background-color: magenta;">Help</button>
</body>
</html>
