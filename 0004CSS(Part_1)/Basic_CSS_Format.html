<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* This is the basic to format to write CSS */
        /* perticular selectors can also be used using '.' and '#' */
        h1{
            color: red;
            background-color: lightgreen;
        }
        /* 
            here:
            h1 :- Selector
            color :- Property
            red :- value
        */
    </style>
    <title>Basic CSS</title>
</head>
<body>
    <h1>Hello World</h1>
</body>
</html>
