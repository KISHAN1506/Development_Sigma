<!-- This is an Emmet Abbreviation -->
 <!-- using ! + enter -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<!-- Parent child p>div will create :-->
    <p>
        <div></div>
    </p>
    <!-- Sibling Relation p+div -->
    <p></p>
    <div></div>
    <!-- with class relation is . -->
    <div class="nameofall"></div>

    <!-- 
    Multiplication: *
    ul>li*5
    -->

    <ul>
        <li>smthing</li>
        <li>smthing</li>
        <li>smthing</li>
        <li>smthing</li>
        <li>smthing</li>
    </ul>

    <!-- 
    D and CLASS attributes
    #header
    <div id="header"></div>
    .title
    <div class="title"></div>
    form#search.wide
    <form id="search" class="wide"></form>
    p.class1.class2.class3
    <p class="class1 class2 class3"></p>
    -->

    <div class="maindiv" id="idk"></div>

    <!-- Best Cheatsheet : https://docs.emmet.io/cheat-sheet/ ❤️ -->


    <!-- p>div+img -->
    <!-- p is parent and div and img are child and also siblings -->
     <p>
        <div></div>
        <img src="" alt="">
     </p>
</body>
</html>
