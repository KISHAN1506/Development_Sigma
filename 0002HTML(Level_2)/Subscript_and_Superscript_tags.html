<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscript and Superscript tags</title>
</head>
<body>
    <!-- 'sub' is child of 'p' and 'p' is the parent tag wrt nesting in HTML -->
    <p>a <sup>2</sup> + b <sup>2</sup> = c <sup>2</sup></p>
    <p>C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></p>
</body>
</html>
