<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Markups</title>
</head>
<body>

    <!-- 
    Semantic Markers: (whose meaning you can understand by their keyword)
    <h1>
    <p>
    <img> 

    Non Semantic Markers: (whose meaning you can not understand by their keyword)
    <div>
    <span>

    -->

    <!-- 
    Advantages of Semantic Tags:
    1. makes a website meaningful and the layout structured
    2. Semantic tags makes website SEO(Search Engine Optimization) friendly
    3. Makes the website code more readable + helps screen readers
    -->
</body>
</html>
