<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscript and Superscript tags</title>
</head>
<body>
    <!-- 'sub' is child of 'p' and 'p' is the parent tag wrt nesting in HTML -->
    <h1>Pythagorus Theorem says a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup></h1>
    <h1>Formula of Glucose is C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></h1>
</body>
</html>
