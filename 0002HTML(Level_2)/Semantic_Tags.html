<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic tags</title>
</head>
<body>
    <header style="background-color: lightcoral;">Kishan Site <a href="www.kishan.com">Kishan</a></header>

    <main style="background-color: lightcyan;">This is the content which is mainly displayed in the website
        <br>
        In short body of the website
    </main>

    <footer style="background-color: lightseagreen;">This comes in the bottom of the website</footer>

    <nav>
        <!-- The <nav> tag in HTML defines a section of navigation links used to navigate through different parts of a website. -->
        <ul>
            <li>
                <a href="/kishan.html">Kishan</a>
            </li>
            <li>
                <a href="/agarwal">Agarwal</a>
            </li>
        </ul>
    </nav>

    <article>
        <!-- The <nav> tag in HTML defines a section of navigation links used to navigate through different parts of a website. -->
    </article>

    <section>
        <!-- Make different sections in a complete content -->
    </section>

    <aside>
        <!-- The <aside> tag in HTML defines content that is tangentially related to the main content, like sidebars or pull quotes.

        Ultimately helps in linking of the content which is indirectly related 
        -->

    </aside>

    <!-- Mainly used for website Optimization ie SEO and improve Readibility -->
</body>
</html>
