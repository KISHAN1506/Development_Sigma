<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block Element </title>
    <style>
        /* .idk{
            display: inline-block;
        } */
    </style>
</head>
<body>
    <!-- Block Elements occupy the complete width irrespective of if they want that space or not -->

    <!-- h1 is a block Elemenet -->
    <h1 class="idk">Hello World</h1>
    <h1 class="idk">Kishan Agarwal</h1>
    
    
    <!-- p is a block Elemenet -->
    <p>Hello</p>
    <p>hru</p>


    <!-- Anchor Tag is a inline Element -->
    <a href="https://google.com">Google</a>
    <a href="https://netflix.com">Netflix</a>


    <!-- Image Tag is a inline Element -->
    <img src="Images/apple.jpeg" alt="Apple">
    <img src="Images/Mango.jpeg" alt="Mango">

</body>
</html>
