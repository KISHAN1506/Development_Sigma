<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css
">
    <title>Form Controls</title>
</head>

<body>
    <div class="container">
        <h1>Form Demo</h1>
        <form>
            <div class="mb-3">
                <input type="checkbox" name="agreement" id="agree">
                <label for="agree">Agreed</label>
            </div>
            <div class="mb-3 form-check">
                <input class="form-check-input" type="checkbox" name="agreement" id="agreed">
                <label class="form-check-label" for="agreed">Agreed</label>
            </div>

            <div class="mb-3">
                <input type="radio" name="agreement" id="agree">
                <label for="agree">Agreed</label>
            </div>
            <div class="mb-3 form-check">
                <input class="form-check-input" type="radio" name="agreement" id="agreed">
                <label class="form-check-label" for="agreed">Agreed</label>
            </div>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>
