<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Position Properties</title>
</head>
<body>
    <section>
        <h2>Static Demo</h2>
        <div>1</div>
        <div id="static">1</div>
    </section>
    <section>
        <h2>Relative Demo</h2>
        <div>2</div>
        <div id="relative">2</div>
        <div>2</div>
    </section>
    <section>
        <h2>Absolute Demo</h2>
        <div>3</div>
        <div id="absolute">3</div>
        <div>3</div>
    </section>
    <section>
        <h2>Fixed Demo</h2>
        <div>4</div>
        <div id="fixed">4</div>
        <div>4</div>
    </section>
</body>
</html>
