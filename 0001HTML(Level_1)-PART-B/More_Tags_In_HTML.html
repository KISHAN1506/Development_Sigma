<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BR tag, Bold, Italic, Underline</title>
</head>
<body>
    <p>Twinkle Twinkle little star how I wonder what you are</p>
    <p>Twinkle Twinkle <br> little star <br> how I wonder <br> what you are</p>
    <b>Bold</b>
    <i>Italic</i>
    <u>Underline</u>
</body>
</html>
